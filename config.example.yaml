server:
  listen: ":8080"          # 本地页面访问地址: http://localhost:8080
  dataDir: "./data"        # 本地暂存文件与发布记录存放目录
  maxUploadMB: 2048        # 支持上传最大产物大小(MB)
  dryRun: false            # true 为演练模式(用于无网络环境模拟测试)

# SSH 服务器长连接池配置（保活心跳常驻，避免频繁 SSH 握手触发限制）
sshServers:
  - id: "prod-server"
    name: "生产 K8s Linux 构建部署机"
    host: "192.168.1.100"   # 服务器 IP
    port: 22
    user: "root"
    authType: "password"   # "password" 或 "key"
    password: "your-password"
    # keyPath: "C:/Users/Administrator/.ssh/id_rsa"

# 应用独立目录与发布命令配置（满足目录分离与镜像版本控制）
apps:
  - id: "order-service"
    name: "order-service"
    description: "订单服务 (Java Jar)"
    serverId: "prod-server"
    type: "jar"             # jar 或 go

    # 0. 本地编译与产物配置（可选：支持一键执行本地编译后上传，也可跳过编译直接上传已有产物）
    localProjectDir: "~/workspace/order-service"     # 本地源码目录
    localBuildCmd: "mvn clean package -DskipTests"   # 本地编译命令
    localArtifactPath: "target/order-service.jar"    # 编译产出文件路径（支持相对 localProjectDir）

    # 1. 目录与配置文件配置（核心需求：多服务共享 K8s YAML 目录 + 不同 YAML 文件名，构建目录各自独立）
    artifactDir: "/data/packages/order-service"      # 该服务放构建产物的独立目录
    buildDir: "/data/docker-build/order-service"     # 该服务构建镜像的独立目录 (含各自 Dockerfile)
    k8sYamlDir: "/data/k8s-yaml"                     # 多个服务共用的 K8s YAML 目录
    k8sYamlFile: "order-service.yaml"                # 该服务独立的 YAML 配置文件名

    # 2. 独立镜像名与动态 Tag 构建部署命令模板
    image: "harbor.example.com/app/order-service"
    buildCmd: "cd {{.BuildDir}} && docker build -t {{.Image}}:{{.Tag}} ."
    pushCmd: ""                                      # 单机不需要推送可留空
    deployCmd: "kubectl apply -f {{.K8sYamlPath}}"   # 部署前系统会自动修改 YAML 文件中的 image 为 {{.Image}}:{{.Tag}} 并持久化保存
    
    # 3. K8s 部署信息
    namespace: "prod"
    deployment: "order-service"
    container: "order-service"
    rolloutTimeout: 300
    autoRollback: true
